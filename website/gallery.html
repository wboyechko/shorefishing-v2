<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Gallery | ShoreFishing.net</title>

<meta name="description"
      content="Explore shore fishing photography from anglers and destinations.">

<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/navigation.css">
<link rel="stylesheet" href="assets/css/gallery.css">
<link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<header id="site-header"></header>

<main>

<section class="gallery-hero">

<h1>Photo Gallery</h1>

<p>

Original photography from shore anglers.

Every picture tells a story.

</p>

</section>

<section class="gallery">

<div class="gallery-viewer">

<button class="gallery-arrow prev"
        aria-label="Previous image">

❮

</button>

<div class="gallery-controls">

    <button
        id="slideshow-toggle"
        type="button"
        aria-pressed="false">
        ▶ Start Slideshow
    </button>

</div>

<img
id="gallery-image"
src="assets/images/gallery/sample01.jpg"
alt="Morning Walleye">

<button class="gallery-arrow next"
        aria-label="Next image">

❯

</button>

<button
    class="gallery-fullscreen"
    type="button"
    aria-label="Enter fullscreen"
    title="Fullscreen">
    ⛶
</button>

</div>

<div class="gallery-caption">

<h2 id="gallery-title">

Morning Walleye

</h2>

<p id="gallery-description">

Early morning success along the shoreline.

</p>

</div>

<div
class="thumbnail-container"
id="thumbnail-container">

<!-- populated by JavaScript -->

</div>

</section>

</main>

<footer id="site-footer"></footer>

<script src="assets/js/gallery.js"></script>

</body>
</html>
