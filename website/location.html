<header class="site-header">

    <div class="container">

        <a
            class="brand"
            href="index.html">

            <img
                src="assets/images/logo/logo.png"
                alt="ShoreFishing.net">

            <div class="brand-text">

                <h1>
                    ShoreFishing.net
                </h1>

                <span>
                    Established 2004
                </span>

            </div>

        </a>

        <nav class="nav-menu">

			<a href="index.html">Home</a>

			<a href="locations.html">Locations</a>

			<a href="how-to-fish.html">

			</a>

			<a href="gallery.html">Gallery</a>

			</a>

		</nav>


			<div
				class="mobile-toggle"
				aria-label="Open navigation"
				role="button"
				tabindex="0">

				<span></span>
				<span></span>
				<span></span>

			</div>

    </div>

</header>


<main>

    <section class="location-header">

        <div class="container">

            <a
                class="back-link"
                href="locations.html">
                ← Back To Locations
            </a>

            <p
                id="location-region"
                class="section-kicker">
            </p>

            <h1 id="location-name">
                Fishing Location
            </h1>

            <p
                id="location-waterbody"
                class="location-waterbody">
            </p>

        </div>

    </section>


    <section class="location-content">

        <div class="container">

            <div
                id="location-error"
                class="location-message">
            </div>


            <div
                id="location-details"
                class="location-details">

                <div class="location-main">

                    <div
                        id="location-photo"
                        class="location-photo">
                    </div>

                    <div
                        id="location-description"
                        class="location-description">
                    </div>

                </div>


                <aside class="location-sidebar">

                    <div
                        id="location-access"
                        class="location-panel">

                        <h2>
                            Shore Access
                        </h2>

                        <p></p>

                    </div>


                    <div
                        id="location-species"
                        class="location-panel">

                        <h2>
                            Species
                        </h2>

                        <ul></ul>

                    </div>


                    <div
                        id="location-notes"
                        class="location-panel">

                        <h2>
                            Notes
                        </h2>

                        <p></p>

                    </div>

                </aside>

            </div>

        </div>

    </section>

</main>
